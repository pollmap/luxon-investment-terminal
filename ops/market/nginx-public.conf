server {
 listen 80;
 server_name stocks.62-171-141-206.sslip.io;
 location ^~ /.well-known/acme-challenge/ { root /var/www/hannun; }
 location / { return 301 https://stocks.62-171-141-206.sslip.io$request_uri; }
}
server {
 listen 443 ssl;
 server_name stocks.62-171-141-206.sslip.io;
 ssl_certificate /etc/letsencrypt/live/stocks-dashboard/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/stocks-dashboard/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 256k;
 gzip on;
 gzip_vary on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 gzip_min_length 512;
 proxy_buffering on;
 proxy_buffers 16 16k;
 proxy_buffer_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 location = / { return 302 /stocks; }
 location = /api/market/v1/account { return 404; }
 location ^~ /api/market-auth { return 404; }
 location ^~ /api/market-account { return 404; }
 location ^~ /api/auth { return 404; }
 location = /api/pf/session { return 404; }
 location = /api/market/v1/stream {
  proxy_pass http://127.0.0.1:8210;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 120s;
 }
 location ~ ^/(stocks(?:/|$)|_next/|api/market(?:/|-)|icon\.svg$) {
  proxy_pass http://127.0.0.1:3210;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 45s;
 }
 location / { return 404; }
}
