name: KR Top 10 E2E
run-name: KR Top 10 E2E ${{ inputs.run_label }}

on:
  workflow_dispatch:
    inputs:
      years:
        description: Year range for source collection, for example 2020:2025
        required: false
        default: 2020:2025
      persist:
        description: Persist normalized data to Neon/Postgres
        required: false
        default: true
        type: boolean
      force_refresh:
        description: Ignore existing cache where supported
        required: false
        default: false
        type: boolean
      continue_on_error:
        description: Continue through the KR Top 10 when one ticker fails
        required: false
        default: true
        type: boolean
      require_consensus_forecast:
        description: Require 1Y-5Y consensus forecast snapshots in coverage gates
        required: false
        default: false
        type: boolean
      sync_blob:
        description: Sync queued raw payloads to Vercel Blob after ingestion
        required: false
        default: true
        type: boolean
      run_deploy_gate:
        description: Run the strict KR deploy gate after ingestion
        required: false
        default: false
        type: boolean
      run_api_smoke:
        description: Run the protected Vercel KR API smoke after source gates
        required: false
        default: false
        type: boolean
      api_smoke_mode:
        description: Protected API smoke mode, full or partial
        required: false
        default: full
      partial_audit_tickers:
        description: Comma-separated partial KR tickers expected to expose gap audit refs
        required: false
        default: 005930.KS
      preview_base_url:
        description: Optional assertion; must match the trusted KR_SMOKE_BASE_URL repository variable
        required: false
        default: ""
      run_label:
        description: Optional operator label used to identify a dispatched run
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kr-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_BACKEND: postgres
      KR_TOP_TEN_TICKERS: 005930.KS,000660.KS,402340.KS,005380.KS,028260.KS,032830.KS,373220.KS,207940.KS,329180.KS,009155.KS
      AUTH_REQUIRED: ${{ vars.AUTH_REQUIRED || 'true' }}
      API_AUTH_REQUIRED: ${{ vars.API_AUTH_REQUIRED || 'true' }}
      API_AUTH_DISABLED: ${{ vars.API_AUTH_DISABLED || 'false' }}
      TRUSTED_SMOKE_BASE_URL: ${{ vars.KR_SMOKE_BASE_URL }}
      RUN_LABEL: ${{ inputs.run_label }}
      INPUT_YEARS: ${{ inputs.years }}
      INPUT_PERSIST: ${{ inputs.persist }}
      INPUT_FORCE_REFRESH: ${{ inputs.force_refresh }}
      INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
      INPUT_REQUIRE_CONSENSUS_FORECAST: ${{ inputs.require_consensus_forecast }}
      INPUT_SYNC_BLOB: ${{ inputs.sync_blob }}
      INPUT_RUN_DEPLOY_GATE: ${{ inputs.run_deploy_gate }}
      INPUT_RUN_API_SMOKE: ${{ inputs.run_api_smoke }}
      INPUT_API_SMOKE_MODE: ${{ inputs.api_smoke_mode }}
      INPUT_PARTIAL_AUDIT_TICKERS: ${{ inputs.partial_audit_tickers }}
      INPUT_PREVIEW_BASE_URL: ${{ inputs.preview_base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev
          pnpm install --frozen-lockfile

      - name: Validate KR secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PF_SESSION_COOKIE: ${{ secrets.PF_SESSION_COOKIE }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL secret is required for KR Top 10 E2E source coverage."
            exit 1
          fi
          if [[ -z "${OPENDART_API_KEY}" && -z "${DART_API_KEY}" ]]; then
            echo "OPENDART_API_KEY or DART_API_KEY secret is required for KR Top 10 E2E."
            exit 1
          fi
          if { [[ "${INPUT_SYNC_BLOB}" == "true" ]] || [[ "${INPUT_RUN_DEPLOY_GATE}" == "true" ]]; } && [[ -z "${BLOB_READ_WRITE_TOKEN}" ]]; then
            echo "BLOB_READ_WRITE_TOKEN secret is required when sync_blob=true or run_deploy_gate=true."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && -z "${TRUSTED_SMOKE_BASE_URL}" ]]; then
            echo "KR_SMOKE_BASE_URL repository variable is required when run_api_smoke=true."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && "${TRUSTED_SMOKE_BASE_URL}" != https://* ]]; then
            echo "KR_SMOKE_BASE_URL must use HTTPS."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && -n "${INPUT_PREVIEW_BASE_URL}" && "${INPUT_PREVIEW_BASE_URL}" != "${TRUSTED_SMOKE_BASE_URL}" ]]; then
            echo "preview_base_url must match the trusted KR_SMOKE_BASE_URL repository variable."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && -z "${PF_SESSION_COOKIE}" ]]; then
            echo "PF_SESSION_COOKIE secret is required when run_api_smoke=true."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && "${INPUT_API_SMOKE_MODE}" != "full" && "${INPUT_API_SMOKE_MODE}" != "partial" ]]; then
            echo "api_smoke_mode must be either full or partial."
            exit 1
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" && "${INPUT_API_SMOKE_MODE}" == "partial" && -z "${INPUT_PARTIAL_AUDIT_TICKERS}" ]]; then
            echo "partial_audit_tickers is required when api_smoke_mode=partial."
            exit 1
          fi
          if [[ -n "${RUN_LABEL}" && ! "${RUN_LABEL}" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "run_label may contain only letters, digits, dot, underscore, and hyphen (max 64)."
            exit 1
          fi

      - name: Mark run label
        shell: bash
        run: |
          if [[ -n "$RUN_LABEL" ]]; then
            echo "KR run label: $RUN_LABEL" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${INPUT_RUN_API_SMOKE}" == "true" ]]; then
            echo "API smoke mode: ${INPUT_API_SMOKE_MODE}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${INPUT_API_SMOKE_MODE}" == "partial" ]]; then
              echo "Partial audit tickers: ${INPUT_PARTIAL_AUDIT_TICKERS}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Doctor KR runtime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_ALLOWED_EMAILS: ${{ secrets.AUTH_ALLOWED_EMAILS }}
        run: uv run python -m services.ingestion_worker.cli doctor --markets KR --strict

      - name: Run KR source E2E
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          set -euo pipefail

          PERSIST_FLAG=""
          FORCE_FLAG=""
          CONTINUE_FLAG=""
          FORECAST_GATE_FLAG=""
          if [[ "${INPUT_PERSIST}" == "true" ]]; then
            PERSIST_FLAG="--persist"
          fi
          if [[ "${INPUT_FORCE_REFRESH}" == "true" ]]; then
            FORCE_FLAG="--force-refresh"
          fi
          if [[ "${INPUT_CONTINUE_ON_ERROR}" == "true" ]]; then
            CONTINUE_FLAG="--continue-on-error"
          fi
          if [[ "${INPUT_REQUIRE_CONSENSUS_FORECAST}" == "true" ]]; then
            FORECAST_GATE_FLAG="--require-consensus-forecast"
          fi

          uv run python -m services.ingestion_worker.cli run-source-e2e \
            --market KR \
            --years "${INPUT_YEARS}" \
            ${CONTINUE_FLAG} \
            ${FORECAST_GATE_FLAG} \
            ${PERSIST_FLAG} ${FORCE_FLAG} \
            --strict

      - name: Verify KR source coverage
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          FORECAST_GATE_FLAG=""
          if [[ "${INPUT_REQUIRE_CONSENSUS_FORECAST}" == "true" ]]; then
            FORECAST_GATE_FLAG="--require-consensus-forecast"
          fi

          uv run python -m services.ingestion_worker.cli source-coverage \
            --market KR \
            ${FORECAST_GATE_FLAG} \
            --strict

      - name: Audit source metadata secrets
        run: uv run python -m services.ingestion_worker.cli secret-audit --strict

      - name: Dry-run Blob queue
        if: ${{ inputs.sync_blob }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: pnpm blob:sync:dry-run

      - name: Sync Blob queue
        if: ${{ inputs.sync_blob }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: pnpm blob:sync

      - name: Run KR deploy gate
        if: ${{ inputs.run_deploy_gate }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_ALLOWED_EMAILS: ${{ secrets.AUTH_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail

          FORECAST_GATE_FLAG=""
          if [[ "${INPUT_REQUIRE_CONSENSUS_FORECAST}" == "true" ]]; then
            FORECAST_GATE_FLAG="--require-consensus-forecast"
          fi

          uv run python -m services.ingestion_worker.cli deploy-gate \
            --markets KR \
            --tickers "${KR_TOP_TEN_TICKERS}" \
            --require-blob \
            ${FORECAST_GATE_FLAG} \
            --strict

      - name: Run protected Vercel KR API smoke
        if: ${{ inputs.run_api_smoke }}
        shell: bash
        env:
          PF_SESSION_COOKIE: ${{ secrets.PF_SESSION_COOKIE }}
        run: |
          set -euo pipefail

          if [[ "${INPUT_API_SMOKE_MODE}" == "partial" ]]; then
            pnpm smoke:api:kr:partial -- \
              --base-url "${TRUSTED_SMOKE_BASE_URL}" \
              --expect-kr-top10-partial-tickers "${INPUT_PARTIAL_AUDIT_TICKERS}"
          else
            pnpm smoke:api:kr -- --base-url "${TRUSTED_SMOKE_BASE_URL}"
          fi
