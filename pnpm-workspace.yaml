packages:
  - "apps/*"
allowBuilds:
  sharp: true
  unrs-resolver: false
# Keep transitive security patches within the currently used major versions.
overrides:
  "undici@>=6 <6.28.1": "6.28.1"
  "sharp@>=0.35.0 <0.35.5": "0.35.5"
  "source-map-js@>=1 <1.2.2": "1.2.2"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "brace-expansion@>=1 <1.1.21": "1.1.21"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
