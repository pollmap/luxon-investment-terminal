[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-fastgraphs"
version = "0.1.0"
description = "Local-first source-traced investment terminal"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14.0",
  "duckdb>=1.5.0",
  "fastapi>=0.136.0",
  "httpx>=0.28.0",
  "lxml>=6.0.0",
  "openpyxl>=3.1.0",
  "matplotlib>=3.10.0",
  "pandas>=2.2.0,<3.0",
  "psycopg[binary]>=3.3.0",
  "pydantic>=2.12.0",
  "pyarrow>=23.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.38.0"
]

[project.scripts]
luxon = "packages.cli.main:main"
nexus = "packages.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "data*", "mcp*", "packages*", "services*"]
namespaces = false

[project.optional-dependencies]
ingestion = [
  "beautifulsoup4>=4.14.0",
  "finance-datareader>=0.9.96",
  "httpx>=0.28.0",
  "lxml>=6.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0,<3.0",
  "pykrx>=1.2.8"
]
warehouse = [
  "duckdb>=1.5.0",
  "pyarrow>=23.0.0"
]
migration = [
  "alembic>=1.18.0"
]
dev = [
  "alembic>=1.18.0",
  "beautifulsoup4>=4.14.0",
  "duckdb>=1.5.0",
  "finance-datareader>=0.9.96",
  "httpx>=0.28.0",
  "lxml>=6.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0,<3.0",
  "pyarrow>=23.0.0",
  "pykrx>=1.2.8",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "network: tests that hit external network",
  "integration: integration tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
